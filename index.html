<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MeuGestor | Gestão de Atividades</title>
<meta name="theme-color" content="#0b2e1d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
:root{
  --bg:#f1f4f8; --card:#fff; --text:#1e293b; --muted:#64748b; --line:#e5e9f0;
  --pri:#16a34a; --pri2:#15803d; --side:#0b2e1d; --gold:#facc15; --blue:#3b82f6; --amber:#f59e0b;
  --green:#10b981; --red:#ef4444; --purple:#8b5cf6; --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
.app{display:flex;min-height:100vh}
.side{width:72px;background:var(--side) repeating-linear-gradient(180deg,rgba(255,255,255,.025) 0 60px,transparent 60px 120px);display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:6px;position:fixed;top:0;bottom:0;left:0;z-index:30}
.side .logo{width:46px;height:46px;border-radius:50%;background:#fff;color:var(--side);overflow:hidden;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;margin-bottom:14px}
.side .nb{width:48px;height:48px;border-radius:12px;border:0;background:transparent;color:#94a3b8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:.15s}
.side .nb span{font-size:9px;font-weight:600;display:none}
.side .nb:hover{color:#fff;background:rgba(255,255,255,.06)}
.side .nb.on{background:rgba(255,255,255,.13);color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.side .spacer{flex:1}
.main{margin-left:72px;flex:1;min-width:0}
.top{height:64px;display:flex;align-items:center;gap:12px;padding:0 24px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top h1{font-family:Oswald,Inter,sans-serif;font-size:21px;margin:0;font-weight:600;white-space:nowrap;text-transform:uppercase;letter-spacing:.02em}
.search{flex:1;max-width:380px;margin-left:auto;position:relative}
.search input{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--line);border-radius:10px;background:var(--bg);outline:none}
.search input:focus{border-color:var(--pri);background:#fff}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.page{padding:24px;max-width:1440px;margin:0 auto}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--text);padding:8px 14px;border-radius:10px;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{background:#f8fafc}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri2)}
.btn.danger{color:var(--red);border-color:#fecaca}
.btn.danger:hover{background:#fef2f2}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.ib{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);padding:0;flex:none}
.ib:hover{color:var(--pri);border-color:var(--pri)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.card h3{margin:0;font-family:Oswald,Inter,sans-serif;font-size:16px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.muted{color:var(--muted)}
.small{font-size:12px}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{border-radius:50%;object-fit:cover;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;color:#fff;white-space:nowrap}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;background:#f1f5f9;color:#475569;white-space:nowrap}
.tag i{width:7px;height:7px;border-radius:50%;display:inline-block}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;cursor:pointer;transition:.15s;border-top:4px solid var(--c)}
.kpi:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(15,23,42,.06)}
.kpi b{display:block;font-family:Oswald,Inter,sans-serif;font-size:34px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted);font-weight:600}
.dash{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:18px;align-items:start}
.stack{display:flex;flex-direction:column;gap:18px}
.hello{display:flex;align-items:center;gap:16px;margin-bottom:18px;padding:22px 24px;border-radius:16px;color:#fff;position:relative;overflow:hidden;
  background:repeating-linear-gradient(90deg,#15803d 0 70px,#16a34a 70px 140px)}
.hello::before{content:"";position:absolute;inset:10px;border:2px solid rgba(255,255,255,.35);border-radius:8px;pointer-events:none}
.hello::after{content:"";position:absolute;left:62%;top:50%;width:120px;height:120px;margin:-60px 0 0 -60px;border:2px solid rgba(255,255,255,.35);border-radius:50%;box-shadow:-60px 0 0 -59px rgba(255,255,255,.35);pointer-events:none}
.hello .meio{position:absolute;left:62%;top:10px;bottom:10px;border-left:2px solid rgba(255,255,255,.35);pointer-events:none}
.hello > *{position:relative;z-index:1}
.hello h2{margin:0;font-family:Oswald,Inter,sans-serif;font-size:28px;font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.hello .sub{color:rgba(255,255,255,.85)}
.hello .escudo{width:58px;height:58px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.hello .escudo img{width:100%;height:100%;object-fit:contain}
.tabs{display:inline-flex;max-width:100%;overflow-x:auto;background:#f1f5f9;border-radius:9px;padding:3px}
.tabs button{white-space:nowrap;border:0;background:transparent;padding:5px 12px;border-radius:7px;font-weight:600;font-size:12px;color:var(--muted)}
.tabs button.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.trow{display:flex;align-items:center;gap:12px;padding:11px 12px;border-left:4px solid var(--c);border-bottom:1px solid var(--line);background:#fff;cursor:pointer}
.trow:hover{background:#f8fafc}
.trow:last-child{border-bottom:0}
.trow .tt{font-weight:600}
.trow.done .tt{text-decoration:line-through;color:var(--muted)}
.chk{width:22px;height:22px;border-radius:50%;border:2px solid #cbd5e1;background:#fff;display:inline-flex;align-items:center;justify-content:center;color:#fff;padding:0;flex:none}
.chk.on{background:var(--green);border-color:var(--green)}
.chk:hover{border-color:var(--green)}
.quick{display:flex;gap:8px;padding:10px 12px;border-top:1px dashed var(--line)}
.quick input{flex:1;border:0;outline:none;background:transparent;padding:4px 0}
.more{display:block;width:100%;border:0;background:#f8fafc;color:var(--pri);font-weight:700;font-size:12px;padding:10px;border-radius:0 0 12px 12px}
.more:hover{background:#eaf6ee}
.list{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.minical{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.minical .h{font-size:10px;font-weight:700;color:var(--muted);padding:4px 0}
.minical .d{position:relative;padding:7px 0;font-size:12px;border-radius:8px;cursor:pointer;border:0;background:transparent}
.minical .d:hover{background:#f1f5f9}
.minical .d.out{color:#cbd5e1}
.minical .d.today{background:var(--pri);color:#fff;font-weight:700}
.minical .d.sel{outline:2px solid var(--pri)}
.minical .d .dot{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--red)}
.minical .d.today .dot{background:#fff}
.ev{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev .dt{width:44px;text-align:center;border-radius:10px;background:#f1f5f9;padding:5px 0;flex:none}
.ev .dt b{display:block;font-size:16px}
.ev .dt span{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase}
.bar{height:8px;background:#eef2f7;border-radius:8px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters select,.filters input{padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;outline:none}
.filters input{min-width:200px}
.ltable .trow{display:grid;grid-template-columns:28px minmax(0,1fr) 170px 90px 110px 140px;gap:12px}
.ltable .lh{display:grid;grid-template-columns:28px minmax(0,1fr) 170px 90px 110px 140px;gap:12px;padding:10px 12px 10px 16px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;background:#f8fafc;border-bottom:1px solid var(--line)}
.ltable select{padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:12px;width:100%}
.kb{display:grid;grid-template-columns:repeat(3,minmax(270px,1fr));gap:18px;overflow-x:auto;padding-bottom:8px}
.kcol{background:transparent;border-radius:14px;min-height:300px;padding:4px;transition:.15s}
.kcol.drop{background:#e8f6ec;outline:2px dashed var(--pri)}
.kcol .kh{display:flex;align-items:center;gap:8px;padding:6px 4px 12px;font-weight:700;font-size:15px}
.kcol .kh .n{background:#e2e8f0;color:#475569;border-radius:20px;font-size:11px;padding:1px 8px}
.kcard{background:#fff;border-radius:10px;padding:12px 14px;margin-bottom:12px;border-left:4px solid var(--c);box-shadow:0 1px 3px rgba(15,23,42,.08);cursor:grab}
.kcard:hover{box-shadow:0 6px 16px rgba(15,23,42,.1)}
.kcard .tt{font-weight:600;margin-bottom:3px}
.kcard .pj{font-size:12px;color:var(--muted);margin-bottom:10px}
.kcard .ft{display:flex;align-items:center;gap:6px}
.cnt{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:2px 7px}
.calhd{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.calhd h2{margin:0;font-size:20px;text-transform:capitalize;min-width:200px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.cal .wh{padding:10px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;border-bottom:1px solid var(--line);background:#f8fafc}
.cal .cell{min-height:118px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;cursor:pointer;min-width:0}
.cal .cell:nth-child(7n){border-right:0}
.cal .cell.out{background:#fafbfc}
.cal .cell.out .num{color:#cbd5e1}
.cal .num{font-size:12px;font-weight:700;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:50%;margin-bottom:4px}
.cal .cell.today .num{background:var(--pri);color:#fff}
.cal .it{display:block;width:100%;text-align:left;font-size:11px;font-weight:600;padding:3px 6px;border-radius:5px;margin-bottom:3px;border:0;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .plus{font-size:11px;color:var(--muted);font-weight:600;padding-left:4px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;padding:16px 18px}
.ccard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;border-top:4px solid var(--c);cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:.15s;min-width:0}
.ccard:hover{box-shadow:0 8px 20px rgba(15,23,42,.09);transform:translateY(-2px)}
.ccard .tt{font-weight:700;line-height:1.3}
.ccard.done .tt{text-decoration:line-through;color:var(--muted)}
.ccard .ft{display:flex;align-items:center;gap:6px;margin-top:auto;padding-top:8px;border-top:1px dashed var(--line)}
.pixbox{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:12px 14px;text-align:left}
.pixbox .k{font-family:ui-monospace,Menlo,monospace;font-size:13px;word-break:break-all;font-weight:600}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.pcard .pb{height:6px}
.pcard .pc{padding:16px;flex:1}
.pcard h4{margin:0 0 4px;font-size:16px}
.pcard .pf{display:flex;gap:6px;padding:12px 16px;border-top:1px solid var(--line);background:#fafbfc;flex-wrap:wrap}
.avs{display:flex}
.avs .av{margin-left:-8px}
.avs .av:first-child{margin-left:0}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.mcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:0 20px 18px;text-align:center;cursor:pointer;transition:.15s;overflow:hidden}
.mcard .topo{margin:0 -20px 0;height:70px;background:repeating-linear-gradient(90deg,#15803d 0 30px,#16a34a 30px 60px);position:relative}
.mcard .topo::after{content:"";position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px;border:2px solid rgba(255,255,255,.4);border-radius:50%}
.mcard .av{margin-top:-38px;position:relative;z-index:1;border-width:4px}
.mcard h4{font-family:Oswald,Inter,sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.pixok{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;color:#047857;background:#d1fae5;border-radius:20px;padding:2px 8px;margin-left:6px}
.mcard:hover{box-shadow:0 6px 16px rgba(15,23,42,.07);transform:translateY(-2px)}
.mcard h4{margin:10px 0 2px;font-size:17px}
.role{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:20px;margin-top:8px}
.role.admin{background:#ede9fe;color:#6d28d9}
.role.gestor{background:#dbeafe;color:#1d4ed8}
.role.executor{background:#dcfce7;color:#15803d}
.info{display:flex;align-items:center;gap:8px;font-size:13px;padding:8px 0;border-bottom:1px solid var(--line)}
.info:last-child{border-bottom:0}
.info svg{color:var(--muted);flex:none}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;animation:fi .15s}
@keyframes fi{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:18px;width:min(900px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.modal.sm{width:min(520px,100%)}
.mh{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.mh h3{margin:0;font-size:17px;flex:1}
.mb{padding:20px;overflow:auto;flex:1}
.mf{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--line);justify-content:flex-end;flex-wrap:wrap}
.mgridf{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:22px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:12px;font-weight:700;color:#475569;margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;outline:none;color:var(--text)}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(22,163,74,.14)}
.fld input:disabled,.fld select:disabled,.fld textarea:disabled{background:#f8fafc;color:#475569}
.fld textarea{resize:vertical;min-height:80px}
.big{font-size:18px!important;font-weight:700}
.side-box{background:#f8fafc;border-radius:12px;padding:14px}
.resp{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px}
.resp .x{border:0;background:transparent;color:#94a3b8;padding:2px;display:flex}
.resp .x:hover{color:var(--red)}
.cl{display:flex;align-items:center;gap:8px;padding:5px 0}
.cl input[type=checkbox]{width:17px;height:17px;accent-color:var(--green)}
.cl .x{margin-left:auto;border:0;background:transparent;color:#94a3b8;padding:2px}
.cmt{display:flex;gap:10px;padding:8px 0}
.cmt .bx{background:#f1f5f9;border-radius:10px;padding:8px 12px;flex:1}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors button{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.colors button.on{box-shadow:0 0 0 2px var(--text)}
.photo{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--side);color:#fff;padding:11px 18px;border-radius:10px;font-weight:600;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:fi .2s}
.banner{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:12px;padding:12px 14px;margin-bottom:18px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:repeating-linear-gradient(90deg,#14532d 0 80px,#166534 80px 160px)}
.auth .box{background:#fff;border-radius:20px;padding:30px;width:min(420px,100%);box-shadow:0 20px 50px rgba(0,0,0,.25)}
.auth h1{margin:0 0 4px;font-size:24px}
.err{background:#fef2f2;color:#b91c1c;border-radius:9px;padding:9px 12px;font-size:13px;margin-bottom:12px}
.ok{background:#ecfdf5;color:#047857;border-radius:9px;padding:9px 12px;font-size:13px;margin-bottom:12px}
.linkb{border:0;background:none;color:var(--pri);font-weight:600;padding:0;font-size:13px}
.prof{display:grid;grid-template-columns:320px minmax(0,1fr);gap:18px;align-items:start}
.back{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--muted);font-weight:600;padding:0;margin-bottom:14px}
.only-m{display:none}
@media (max-width:1100px){
  .dash{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(3,1fr)}
  .ltable .trow,.ltable .lh{grid-template-columns:28px minmax(0,1fr) 140px 110px 130px}
  .ltable .c-pri{display:none}
}
@media (max-width:760px){
  .hello{padding:16px}
  .hello::after,.hello .meio{display:none}
  .cgrid{grid-template-columns:1fr;padding:12px}
  .side{flex-direction:row;top:auto;width:100%;height:62px;justify-content:space-around;padding:0 4px calc(env(safe-area-inset-bottom)) 4px;gap:0}
  .side .logo,.side .spacer,.side .hide-m{display:none}
  .side .nb{width:auto;flex:1;height:54px;border-radius:10px}
  .side .nb span{display:block}
  .main{margin-left:0;padding-bottom:70px}
  .top{padding:0 14px;height:58px}
  .top h1{font-size:16px}
  .top .btn.pri .lbl{display:none}
  .search{display:none}
  .only-m{display:inline-flex}
  .page{padding:14px}
  .kpis{grid-template-columns:repeat(2,1fr);gap:10px}
  .kpi b{font-size:22px}
  .hello h2{font-size:22px}
  .ltable .lh{display:none}
  .ltable .trow{grid-template-columns:28px minmax(0,1fr) auto;row-gap:6px}
  .ltable .c-resp,.ltable .c-pri{display:none}
  .ltable .c-st{grid-column:2 / 4}

  emit(col) { (this.subs[col] || []).forEach(cb => cb()); },
  listen(col, cb) { const f = () => cb(this.list(col)); (this.subs[col] = this.subs[col] || []).push(f); f(); return () => { this.subs[col] = this.subs[col].filter(x => x !== f); }; },
  save(col, id, o) { this.data[col] = this.data[col] || {}; this.data[col][id] = { ...(this.data[col][id] || {}), ...limpar(o) }; this.persist(); this.emit(col); },
  remove(col, id) { if (this.data[col]) delete this.data[col][id]; this.persist(); this.emit(col); },
  reset() { this.data = seed(); this.persist(); Object.keys(this.subs).forEach(c => this.emit(c)); }
};

/* ============================ CAMADA DE DADOS ============================ */
let fbAuth = null, fbDb = null;
function carregarScript(src) { return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function carregarFirebase() {
  const v = "10.12.2";
  await carregarScript(`https://www.gstatic.com/firebasejs/${v}/firebase-app-compat.js`);
  await carregarScript(`https://www.gstatic.com/firebasejs/${v}/firebase-auth-compat.js`);
  await carregarScript(`https://www.gstatic.com/firebasejs/${v}/firebase-firestore-compat.js`);
  firebase.initializeApp(FIREBASE_CONFIG);
  fbAuth = firebase.auth(); fbDb = firebase.firestore();
  fbAuth.languageCode = "pt";
}
function criarStore(session) {
  if (session.demo) return {
    listen: (col, cb) => Demo.listen(col, cb),
    save: (col, id, o) => Promise.resolve(Demo.save(col, id, o)),
    remove: (col, id) => Promise.resolve(Demo.remove(col, id)),
    listenOrg: cb => { const f = () => cb(Demo.data.org || {}); (Demo.subs.__org = Demo.subs.__org || []).push(f); f(); return () => { Demo.subs.__org = Demo.subs.__org.filter(x => x !== f); }; },
    saveOrg: o => { Demo.data.org = { ...Demo.data.org, ...o }; Demo.persist(); Demo.emit("__org"); return Promise.resolve(); },
    convite: () => Promise.resolve(), removerConvite: () => Promise.resolve()
  };
  const ref = fbDb.collection("mg_orgs").doc(session.orgId);
  return {
    listen: (col, cb, filtro) => {
      let q = ref.collection(col);
      if (filtro) q = filtro.length === 3 ? q.where(filtro[0], filtro[1], filtro[2]) : q.where(filtro[0], "==", filtro[1]);
      return q.onSnapshot(s => cb(s.docs.map(d => ({ id: d.id, ...d.data() }))), e => console.error(col, e));
    },
    save: (col, id, o) => ref.collection(col).doc(id).set(limpar(o), { merge: true }),
    remove: (col, id) => ref.collection(col).doc(id).delete(),
    listenOrg: cb => ref.onSnapshot(d => cb(d.data() || {}), e => console.error(e)),
    saveOrg: o => ref.set(limpar(o), { merge: true }),
    convite: (email, dados) => fbDb.collection("mg_convites").doc(email.toLowerCase().trim()).set({ ...dados, orgId: session.orgId }, { merge: true }),
    removerConvite: email => fbDb.collection("mg_convites").doc(email.toLowerCase().trim()).delete().catch(() => {})
  };
}

function App() {
  const [st, setSt] = useState({ fase: "carregando" });

  async function resolver(u) {
    if (!u) return setSt({ fase: "login" });
    if (!u.emailVerified) return setSt({ fase: "verificar", user: u });
    try {
      let doc = await fbDb.collection("mg_users").doc(u.uid).get();
      if (!doc.exists) {
        const c = await fbDb.collection("mg_convites").doc(u.email.toLowerCase()).get();
        if (c.exists) {
          const cv = c.data();
          await fbDb.collection("mg_users").doc(u.uid).set({ orgId: cv.orgId, role: cv.role, membroId: cv.membroId, email: u.email });
          doc = await fbDb.collection("mg_users").doc(u.uid).get();
        }
      }
      if (!doc.exists) return setSt({ fase: "semacesso", user: u });
      const p = doc.data();
      setSt({ fase: "app", session: { uid: u.uid, email: u.email, orgId: p.orgId, role: p.role, membroId: p.membroId } });
    } catch (e) { console.error(e); setSt({ fase: "semacesso", user: u, erro: traduzErro(e) }); }
  }

  useEffect(() => {
    if (MODO_DEMO) {
      Demo.load();
      let mid = "m_admin"; try { mid = localStorage.getItem("meugestor_demo_sessao") || "m_admin"; } catch (e) {}
      if (!Demo.data.membros[mid]) mid = "m_admin";
      setSt({ fase: "app", session: { demo: true, membroId: mid } });
      return;
    }
    carregarFirebase().then(() => fbAuth.onAuthStateChanged(resolver)).catch(() => setSt({ fase: "erro" }));
  }, []);

  if (st.fase === "carregando") return <div className="auth"><div style={{ color: "#fff", fontWeight: 700 }}>Carregando...</div></div>;
  if (st.fase === "erro") return <div className="auth"><div className="box"><h1>Sem conexão</h1><p className="muted">Não foi possível carregar o Firebase. Verifique a internet e recarregue a página.</p></div></div>;
  if (st.fase === "login") return <AuthScreen />;
  if (st.fase === "verificar") return <VerificarScreen user={st.user} onOk={() => st.user.reload().then(() => resolver(fbAuth.currentUser))} />;
  if (st.fase === "semacesso") return (
    <div className="auth"><div className="box">
      <h1>Sem acesso</h1>
      {st.erro && <div className="err">{st.erro}</div>}
      <p className="muted">Sua conta ({st.user.email}) ainda não está ligada a nenhuma empresa. Peça ao administrador ou gestor para cadastrar seu perfil no Elenco com este mesmo e-mail e depois entre novamente.</p>
      <div className="row"><button className="btn pri" onClick={() => resolver(fbAuth.currentUser)}>Tentar de novo</button><button className="btn" onClick={() => fbAuth.signOut()}>Sair</button></div>
    </div></div>
  );
  return <Main session={st.session} />;
}

function AuthScreen() {
  const [aba, setAba] = useState("entrar");
  const [f, setF] = useState({ nome: "", empresa: "", email: "", senha: "" });
  const [erro, setErro] = useState(""); const [msg, setMsg] = useState(""); const [busy, setBusy] = useState(false);
  const set = (k, v) => setF(p => ({ ...p, [k]: v }));

  async function enviar(e) {
    e.preventDefault(); setErro(""); setMsg(""); setBusy(true);
    try {
      if (aba === "entrar") {
        await fbAuth.signInWithEmailAndPassword(f.email.trim(), f.senha);
      } else if (aba === "empresa") {
        if (!f.nome.trim() || !f.empresa.trim()) throw new Error("Preencha seu nome e o nome da empresa.");
        const cred = await fbAuth.createUserWithEmailAndPassword(f.email.trim(), f.senha);
        const u = cred.user; const orgId = uid(); const membroId = "m_" + u.uid;
        await u.updateProfile({ displayName: f.nome.trim() });
        await fbDb.collection("mg_orgs").doc(orgId).set({ nome: f.empresa.trim(), ownerUid: u.uid, criadoEm: Date.now() });
        await fbDb.collection("mg_users").doc(u.uid).set({ orgId, role: "admin", membroId, email: u.email });
        await fbDb.collection("mg_orgs").doc(orgId).collection("membros").doc(membroId).set({ nome: f.nome.trim(), email: u.email, role: "admin", uid: u.uid, cargo: "Administrador", setor: "", telefone: "" });
        await u.sendEmailVerification();
      } else {
        const cred = await fbAuth.createUserWithEmailAndPassword(f.email.trim(), f.senha);
        const u = cred.user;
        const c = await fbDb.collection("mg_convites").doc(u.email.toLowerCase()).get();
        if (!c.exists) { await u.delete(); throw new Error("Não encontramos convite para este e-mail. Peça ao gestor para cadastrar seu perfil com este e-mail."); }
        const cv = c.data();
        await fbDb.collection("mg_users").doc(u.uid).set({ orgId: cv.orgId, role: cv.role, membroId: cv.membroId, email: u.email });
        await u.sendEmailVerification();
      }
    } catch (err) { setErro(traduzErro(err)); }
    setBusy(false);
  }
  async function esqueci() {
    setErro(""); setMsg("");
    if (!f.email.trim()) return setErro("Digite seu e-mail acima para receber o link.");
    try { await fbAuth.sendPasswordResetEmail(f.email.trim()); setMsg("Enviamos um link de redefinição para o seu e-mail."); } catch (e) { setErro(traduzErro(e)); }
  }
  return (
    <div className="auth"><form className="box" onSubmit={enviar}>
      <div className="row" style={{ marginBottom: 16 }}><div className="side" style={{ position: "static", width: "auto", background: "none", padding: 0 }}><div className="logo" style={{ margin: 0, background: "var(--pri)", color: "#fff" }}><Bola /></div></div><div><h1>{NOME_APP}</h1><div className="muted small">Gestão de atividades da sua equipe</div></div></div>
      <div className="tabs" style={{ marginBottom: 18, width: "100%" }}>
        {[["entrar", "Entrar"], ["empresa", "Criar empresa"], ["convite", "Tenho convite"]].map(([k, l]) =>
          <button type="button" key={k} className={aba === k ? "on" : ""} style={{ flex: 1 }} onClick={() => { setAba(k); setErro(""); setMsg(""); }}>{l}</button>)}
      </div>
      {erro && <div className="err">{erro}</div>}
      {msg && <div className="ok">{msg}</div>}
      {aba === "empresa" && <>
        <div className="fld"><label>Seu nome</label><input value={f.nome} onChange={e => set("nome", e.target.value)} required /></div>
        <div className="fld"><label>Nome da empresa</label><input value={f.empresa} onChange={e => set("empresa", e.target.value)} required /></div>
      </>}
      {aba === "convite" && <p className="small muted" style={{ marginTop: 0 }}>Use o mesmo e-mail que o gestor cadastrou no seu perfil.</p>}
      <div className="fld"><label>E-mail</label><input type="email" value={f.email} onChange={e => set("email", e.target.value)} required autoComplete="email" /></div>
      <div className="fld"><label>Senha</label><input type="password" value={f.senha} onChange={e => set("senha", e.target.value)} required minLength={6} autoComplete={aba === "entrar" ? "current-password" : "new-password"} /></div>
      <button className="btn pri" style={{ width: "100%", justifyContent: "center", padding: 11 }} disabled={busy}>{busy ? "Aguarde..." : aba === "entrar" ? "Entrar" : "Criar conta"}</button>
      {aba === "entrar" && <div style={{ textAlign: "center", marginTop: 14 }}><button type="button" className="linkb" onClick={esqueci}>Esqueci minha senha</button></div>}
    </form></div>
  );
}

        <b className="grow" style={{ textTransform: "capitalize" }}>{MESES[ref.getMonth()]} {ref.getFullYear()}</b>
        <button className="ib" onClick={() => setRef(new Date(ref.getFullYear(), ref.getMonth() - 1, 1))}><Icon n="left" s={14} /></button>
        <button className="ib" onClick={() => setRef(new Date(ref.getFullYear(), ref.getMonth() + 1, 1))}><Icon n="right" s={14} /></button>
      </div>
      <div className="minical">
        {SEMANA.map(s => <div key={s} className="h">{s[0]}</div>)}
        {dias.map(d => <button key={d.iso} className={"d" + (d.fora ? " out" : "") + (d.iso === hoje ? " today" : "") + (d.iso === sel ? " sel" : "")} onClick={() => onSel(d.iso === sel ? null : d.iso)}>
          {d.dia}{marcados.has(d.iso) && <span className="dot" />}</button>)}
      </div>
    </div>
  );
}
function gradeMes(ref) {
  const ini = new Date(ref.getFullYear(), ref.getMonth(), 1); ini.setDate(1 - ini.getDay());
  const fim = new Date(ref.getFullYear(), ref.getMonth() + 1, 0); const dias = [];
  const d = new Date(ini);
  while (d <= fim || d.getDay() !== 0) { dias.push({ iso: isoDe(d), dia: d.getDate(), fora: d.getMonth() !== ref.getMonth() }); d.setDate(d.getDate() + 1); }
  return dias;
}

function QuadroCartoes({ ctx }) {
  const [filtro, setFiltro] = useState("abertas");
  const [resp, setResp] = useState("");
  const [qtd, setQtd] = useState(8);
  const base = ctx.atividades.filter(a => !resp || temResp(a, resp));
  const F = {
    abertas: ["Em aberto", a => a.status !== "concluida"],
    pendente: ["Pendentes", a => a.status === "pendente"],
    andamento: ["Em andamento", a => a.status === "andamento"],
    atrasadas: ["Atrasadas", atrasada],
    concluida: ["Concluídas", a => a.status === "concluida"],
    todas: ["Todas", () => true]
  };
  const lista = ordenar(base.filter(F[filtro][1]));
  const trocar = f => { setFiltro(f); setQtd(8); };
  return (
    <div className="card" style={{ padding: 0, marginBottom: 18 }}>
      <div className="ch" style={{ padding: "16px 18px 0", flexWrap: "wrap" }}>
        <h3>Quadro de atividades</h3>

        {ctx.gestor && <select value={resp} onChange={e => { setResp(e.target.value); setQtd(8); }} style={{ padding: "6px 10px", border: "1px solid var(--line)", borderRadius: 9, background: "#fff" }}>
          <option value="">Todo o elenco</option>{[...ctx.membros].sort((x, y) => x.nome.localeCompare(y.nome)).map(m => <option key={m.id} value={m.id}>{m.nome}</option>)}</select>}
      </div>
      <div style={{ padding: "0 18px", overflowX: "auto" }}>
        <div className="tabs">{Object.entries(F).map(([k, [l, fn]]) => { const c = base.filter(fn).length; return (
          <button key={k} className={filtro === k ? "on" : ""} onClick={() => trocar(k)} style={k === "atrasadas" && c ? { color: "var(--red)" } : null}>{l} ({c})</button>); })}</div>
      </div>

    </div>
  );
}

/* ========================= DELEGADAS POR MIM ========================= */
function Delegadas({ ctx }) {
  const [filtro, setFiltro] = useState("abertas");
  const [agrupar, setAgrupar] = useState(false);
  const [qtd, setQtd] = useState(8);
  const todas = ctx.atividades.filter(a => a.criadoPor === ctx.meuId && resps(a).some(id => id !== ctx.meuId));
  const n = {
    abertas: todas.filter(a => a.status !== "concluida").length,
    atrasadas: todas.filter(atrasada).length,
    concluidas: todas.filter(a => a.status === "concluida").length,
    todas: todas.length
  };
  const lista = ordenar(todas.filter(a =>
    filtro === "abertas" ? a.status !== "concluida" :
    filtro === "atrasadas" ? atrasada(a) :
    filtro === "concluidas" ? a.status === "concluida" : true));
  const pct = Math.round(n.concluidas / n.todas * 100);
  const grupos = useMemo(() => {
    const g = {};
    lista.forEach(a => resps(a).filter(id => id !== ctx.meuId).forEach(id => (g[id] = g[id] || []).push(a)));
    return Object.entries(g).sort((x, y) => y[1].length - x[1].length);
  }, [filtro, ctx.atividades, ctx.meuId]);
  if (todas.length === 0) return null;
  const trocar = f => { setFiltro(f); setQtd(8); };
  return (
    <div className="card" style={{ padding: 0 }}>
      <div className="ch" style={{ padding: "16px 18px 0", flexWrap: "wrap" }}>
        <h3>Delegadas por mim</h3>
        <span className="small muted">{n.todas} no total · {pct}% concluídas</span>
        <div className="grow" />
        <label className="small row" style={{ gap: 6, cursor: "pointer" }}><input type="checkbox" checked={agrupar} onChange={e => { setAgrupar(e.target.checked); setQtd(8); }} />Agrupar por pessoa</label>
      </div>
      <div style={{ padding: "0 18px 12px" }}>
        <div className="bar" style={{ marginBottom: 12 }}><i style={{ width: pct + "%", background: STATUS.concluida.cor }} /></div>
        <div className="tabs">
          {[["abertas", "Em aberto"], ["atrasadas", "Atrasadas"], ["concluidas", "Concluídas"], ["todas", "Todas"]].map(([k, l]) =>
            <button key={k} className={filtro === k ? "on" : ""} onClick={() => trocar(k)} style={k === "atrasadas" && n.atrasadas ? { color: "var(--red)" } : null}>{l} ({n[k]})</button>)}
        </div>
      </div>
      <div style={{ borderTop: "1px solid var(--line)" }}>
        {lista.length === 0 && <div className="empty">{filtro === "atrasadas" ? "Nenhuma atividade delegada está atrasada." : "Nada por aqui."}</div>}
        {!agrupar && lista.slice(0, qtd).map(a => <TarefaRow key={a.id} a={a} ctx={ctx} />)}
        {agrupar && grupos.slice(0, qtd).map(([mid, ats]) => { const m = ctx.mapM[mid]; const atr = ats.filter(atrasada).length; return (
          <div key={mid}>
            <div className="row" style={{ padding: "10px 14px", background: "#f8fafc", borderBottom: "1px solid var(--line)", cursor: "pointer" }} onClick={() => ctx.abrirPerfil(mid)}>
              <Avatar m={m} size={26} /><b className="grow ell">{m ? m.nome : "Perfil removido"}</b>
              {atr > 0 && <Chip cor="#ef4444">{atr} atrasada{atr > 1 ? "s" : ""}</Chip>}
              <span className="small muted">{ats.length} atividade{ats.length > 1 ? "s" : ""}</span>
            </div>
            {ats.map(a => <TarefaRow key={a.id} a={a} ctx={ctx} mostrarResp={false} />)}
          </div>); })}
      </div>
      <VerMais total={agrupar ? grupos.length : lista.length} mostrando={qtd} passo={8} onMais={() => setQtd(qtd + 8)} />
    </div>
  );
}

/* ================================= LISTA ================================= */
function Lista({ ctx, inicial }) {
  const [f, setF] = useState({ texto: "", resp: "", projeto: "", local: "", status: "", prioridade: "", prazo: "", ...inicial });
  const [qtd, setQtd] = useState(15);
  useEffect(() => { setF({ texto: "", resp: "", projeto: "", local: "", status: "", prioridade: "", prazo: "", ...inicial }); setQtd(15); }, [inicial]);
  const set = (k, v) => { setF(p => ({ ...p, [k]: v })); setQtd(15); };
  const hoje = hojeISO(), semana = somaDias(7);
  const lista = useMemo(() => ordenar(ctx.atividades.filter(a => {
    if (f.texto && !(`${a.titulo} ${a.descricao || ""}`).toLowerCase().includes(f.texto.toLowerCase())) return false;
    if (f.resp && !temResp(a, f.resp)) return false;
    if (f.projeto && a.projetoId !== f.projeto) return false;
    if (f.local && a.localId !== f.local) return false;
    if (f.status && a.status !== f.status) return false;
    if (f.prioridade && a.prioridade !== f.prioridade) return false;
    if (f.prazo === "atrasadas" && !atrasada(a)) return false;
    if (f.prazo === "hoje" && a.prazo !== hoje) return false;
    if (f.prazo === "semana" && !(a.prazo && a.prazo >= hoje && a.prazo <= semana)) return false;
    if (f.prazo === "sem" && a.prazo) return false;
    return true;
  })), [ctx.atividades, f]);
  const temFiltro = Object.values(f).some(Boolean);
  return (<>
    <div className="filters">
      <input placeholder="Buscar por título..." value={f.texto} onChange={e => set("texto", e.target.value)} />
      {ctx.gestor && <select value={f.resp} onChange={e => set("resp", e.target.value)}><option value="">Todos os responsáveis</option>{ctx.membros.map(m => <option key={m.id} value={m.id}>{m.nome}</option>)}</select>}
      <select value={f.projeto} onChange={e => set("projeto", e.target.value)}><option value="">Todos os projetos</option>{ctx.projetos.map(p => <option key={p.id} value={p.id}>{p.nome}</option>)}</select>
      {ctx.locais.length > 0 && <select value={f.local} onChange={e => set("local", e.target.value)}><option value="">Todos os locais</option>{[...ctx.locais].sort((x, y) => x.nome.localeCompare(y.nome)).map(l => <option key={l.id} value={l.id}>{l.nome}</option>)}</select>}
      <select value={f.status} onChange={e => set("status", e.target.value)}><option value="">Todos os status</option>{Object.entries(STATUS).map(([k, s]) => <option key={k} value={k}>{s.um}</option>)}</select>
      <select value={f.prioridade} onChange={e => set("prioridade", e.target.value)}><option value="">Todas as prioridades</option>{Object.entries(PRIORIDADES).map(([k, s]) => <option key={k} value={k}>{s.label}</option>)}</select>
      <select value={f.prazo} onChange={e => set("prazo", e.target.value)}><option value="">Qualquer prazo</option><option value="atrasadas">Atrasadas</option><option value="hoje">Vencem hoje</option><option value="semana">Próximos 7 dias</option><option value="sem">Sem prazo</option></select>
      {temFiltro && <button className="btn" onClick={() => { setF({ texto: "", resp: "", projeto: "", local: "", status: "", prioridade: "", prazo: "" }); setQtd(15); }}>Limpar filtros</button>}
    </div>
    <div className="small muted" style={{ marginBottom: 8 }}>{lista.length} atividade{lista.length !== 1 ? "s" : ""}</div>

    sc.async = true; sc.onerror = () => { _gmFalhou = true; rej(new Error("load")); };

function LocalModal({ ctx, inicial, onClose }) {
  const [l, setL] = useState({ nome: "", tipo: "campo", descricao: "", ...inicial });
  const [erro, setErro] = useState(""); const set = (k, v) => setL(x => ({ ...x, [k]: v }));
  async function salvar() {
    if (!l.nome.trim()) return setErro("Dê um nome ao local.");
    const lat = +l.lat, lng = +l.lng;
    if (!isFinite(lat) || !isFinite(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180) return setErro("Coordenadas inválidas.");
    try { const { id, ...d } = l; const nid = id || "l_" + uid(); await ctx.store.save("locais", nid, { ...d, lat, lng, nome: l.nome.trim(), criadoEm: l.criadoEm || Date.now() }); ctx.notificar(id ? "Local atualizado" : "Pin criado"); ctx.setLocalSel(nid); onClose(); } catch (e) { setErro(traduzErro(e)); }
  }
  async function excluir() {
    const vinc = ctx.atividades.filter(a => a.localId === l.id);
    if (!confirm(`Excluir o local "${l.nome}"?${vinc.length ? ` ${vinc.length} atividade(s) ficarão sem local.` : ""}`)) return;
    try { for (const a of vinc) await ctx.store.save("atividades", a.id, { localId: "", atualizadoEm: Date.now() }); await ctx.store.remove("locais", l.id); ctx.setLocalSel(null); ctx.notificar("Local excluído"); onClose(); } catch (e) { setErro(traduzErro(e)); }
  }
  return (
    <Modal sm titulo={l.id ? "Editar local" : "Novo local de trabalho"} onClose={onClose}
      rodape={<>{l.id && <button className="btn danger" onClick={excluir}><Icon n="trash" s={15} />Excluir</button>}<div className="grow" /><button className="btn" onClick={onClose}>Cancelar</button><button className="btn pri" onClick={salvar}>Salvar</button></>}>
      {erro && <div className="err">{erro}</div>}
      <div className="fld"><label>Nome do local</label><input autoFocus value={l.nome} onChange={e => set("nome", e.target.value)} placeholder="Ex.: Campo 2, Vestiário Sub-17" /></div>
      <div className="fld"><label>Tipo</label><select value={l.tipo} onChange={e => set("tipo", e.target.value)}>{Object.entries(TIPOS_LOCAL).map(([k, [n]]) => <option key={k} value={k}>{n}</option>)}</select></div>
      <div className="fld"><label>Observações</label><textarea value={l.descricao || ""} onChange={e => set("descricao", e.target.value)} placeholder="Ponto de referência, horário de uso, responsável pela chave..." /></div>
      <div className="row" style={{ gap: 12 }}>
        <div className="fld grow"><label>Latitude</label><input value={l.lat} onChange={e => set("lat", e.target.value)} /></div>
        <div className="fld grow"><label>Longitude</label><input value={l.lng} onChange={e => set("lng", e.target.value)} /></div>
      </div>
      <div className="small muted">Para ajustar a posição depois, arraste o pin no mapa.</div>
    </Modal>
  );
}

    const n = ctx.atividades.filter(a => a.projetoId === p.id).length;
    if (!confirm(`Excluir o projeto "${p.nome}"?${n ? ` As ${n} atividades dele continuam existindo, mas ficarão sem projeto.` : ""}`)) return;
    try { await ctx.store.remove("projetos", p.id); ctx.notificar("Projeto excluído"); } catch (e) { ctx.notificar(traduzErro(e)); }

              <div className="row wrap" style={{ gap: 6 }}>
                <Tag cor={STATUS.pendente.cor}>{c("pendente")} pendentes</Tag><Tag cor={STATUS.andamento.cor}>{c("andamento")} em andamento</Tag>
                {atr > 0 && <Tag cor="#ef4444">{atr} atrasada{atr > 1 ? "s" : ""}</Tag>}

            </div>
            <div className="pf">
              <button className="btn sm" onClick={() => ctx.irLista({ projeto: p.id })}><Icon n="list" s={14} />Atividades</button>

  return <div className="ov" onMouseDown={e => e.target === e.currentTarget && onClose()}>
    <div className={"modal" + (sm ? " sm" : "")}>
      <div className="mh"><h3>{titulo}</h3><button className="ib" onClick={onClose}><Icon n="x" s={16} /></button></div>
      <div className="mb">{children}</div>
      {rodape && <div className="mf">{rodape}</div>}

}

        <div>
          <div className="fld"><label>Título</label><input className="big" autoFocus={novo} value={a.titulo} disabled={!g} onChange={e => set("titulo", e.target.value)} placeholder="O que precisa ser feito?" /></div>
          <div className="fld"><label>Descrição</label><textarea value={a.descricao || ""} disabled={!g} onChange={e => set("descricao", e.target.value)} placeholder={g ? "Detalhes, orientações, links..." : ""} /></div>
          <div className="fld"><label>Checklist {(a.checklist || []).length > 0 && <span className="muted">({feitos}/{a.checklist.length})</span>}</label>
            {(a.checklist || []).length > 0 && <div className="bar" style={{ marginBottom: 8 }}><i style={{ width: feitos / a.checklist.length * 100 + "%", background: "var(--green)" }} /></div>}
            {(a.checklist || []).map(c => <div key={c.id} className="cl">
              <input type="checkbox" checked={!!c.feito} onChange={() => set("checklist", a.checklist.map(x => x.id === c.id ? { ...x, feito: !x.feito } : x))} />
              <span style={c.feito ? { textDecoration: "line-through", color: "var(--muted)" } : null}>{c.texto}</span>
              {g && <button className="x" onClick={() => set("checklist", a.checklist.filter(x => x.id !== c.id))}><Icon n="x" s={14} /></button>}
            </div>)}
            {g && <div className="row" style={{ marginTop: 6 }}><input value={novoItem} placeholder="Adicionar item" onChange={e => setNovoItem(e.target.value)} onKeyDown={e => { if (e.key === "Enter") { e.preventDefault(); addItem(); } }} style={{ flex: 1, padding: "8px 10px", border: "1px solid var(--line)", borderRadius: 9 }} /><button className="btn sm" onClick={addItem}>Adicionar</button></div>}
          </div>
          <div className="fld"><label>Comentários</label>
            {(a.comentarios || []).map(c => { const m = ctx.mapM[c.autorId]; return <div key={c.id} className="cmt"><Avatar m={m} size={28} /><div className="bx"><div className="small"><b>{m ? m.nome : "Usuário"}</b> <span className="muted">{new Date(c.em).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })}</span></div><div style={{ marginTop: 2, whiteSpace: "pre-wrap" }}>{c.texto}</div></div></div>; })}
            <div className="row" style={{ marginTop: 6, alignItems: "flex-start" }}><textarea value={novoCmt} placeholder="Escreva um comentário" onChange={e => setNovoCmt(e.target.value)} style={{ flex: 1, minHeight: 44, padding: "8px 10px", border: "1px solid var(--line)", borderRadius: 9, resize: "vertical" }} /><button className="btn sm" onClick={addCmt}>Enviar</button></div>
          </div>
        </div>
        <div>
          <div className="side-box">
            <div className="fld"><label>Status</label><select value={a.status} onChange={e => set("status", e.target.value)}>{Object.entries(STATUS).map(([k, s]) => <option key={k} value={k}>{s.um}</option>)}</select></div>
            <div className="fld"><label>Responsáveis {a.responsavelIds.length > 1 && <span className="muted">({a.responsavelIds.length})</span>}</label>
              {a.responsavelIds.map(id => { const m = ctx.mapM[id]; if (!m) return null; const px = g && ctx.mapPix[id]; return (
                <div key={id} className="resp">
                  <div className="row"><Avatar m={m} size={28} /><div className="grow" style={{ minWidth: 0 }}><div className="ell" style={{ fontWeight: 600, fontSize: 13 }}>{m.nome}</div><div className="small muted ell">{m.cargo || ""}</div></div>
                    {g && <button className="x" title="Retirar" onClick={() => set("responsavelIds", a.responsavelIds.filter(x => x !== id))}><Icon n="x" s={14} /></button>}</div>
                  {px && px.chave && <div style={{ marginTop: 6 }}><PixInfo pix={px} ctx={ctx} compacto /></div>}
                </div>); })}
              {g && <select value="" onChange={e => e.target.value && set("responsavelIds", [...a.responsavelIds, e.target.value])}>
                <option value="">{a.responsavelIds.length ? "+ Adicionar outra pessoa" : "Escolher pessoa..."}</option>
                {[...ctx.membros].filter(m => !a.responsavelIds.includes(m.id)).sort((x, y) => x.nome.localeCompare(y.nome)).map(m => <option key={m.id} value={m.id}>{m.nome}{m.setor ? " · " + m.setor : ""}</option>)}</select>}
              {a.responsavelIds.length > 1 && <div className="small muted" style={{ marginTop: 6 }}>Atividade em conjunto: quando qualquer um concluir, ela fica concluída para todos.</div>}
            </div>
            <div className="fld"><label>Projeto</label><select value={a.projetoId || ""} disabled={!g} onChange={e => set("projetoId", e.target.value)}><option value="">Sem projeto</option>{ctx.projetos.map(p => <option key={p.id} value={p.id}>{p.nome}</option>)}</select></div>
            <div className="fld"><label>Local</label><select value={a.localId || ""} disabled={!g} onChange={e => set("localId", e.target.value)}><option value="">Sem local</option>{[...ctx.locais].sort((x, y) => x.nome.localeCompare(y.nome)).map(l => <option key={l.id} value={l.id}>{l.nome} · {(TIPOS_LOCAL[l.tipo] || TIPOS_LOCAL.outro)[0]}</option>)}</select>
              {a.localId && ctx.mapL[a.localId] && <div className="row small" style={{ marginTop: 6, gap: 12 }}><button className="linkb" onClick={() => { onClose(); ctx.verNoMapa(a.localId); }}>Ver no mapa</button><a className="linkb" href={linkRota(ctx.mapL[a.localId])} target="_blank" rel="noopener">Como chegar</a></div>}
              {g && ctx.locais.length === 0 && <div className="small muted" style={{ marginTop: 4 }}>Cadastre locais na aba Mapa.</div>}</div>
            <div className="fld"><label>Prioridade</label><select value={a.prioridade} disabled={!g} onChange={e => set("prioridade", e.target.value)}>{Object.entries(PRIORIDADES).map(([k, s]) => <option key={k} value={k}>{s.label}</option>)}</select></div>
            <div className="fld" style={{ marginBottom: 0 }}><label>Prazo</label><input type="date" value={a.prazo || ""} disabled={!g} onChange={e => set("prazo", e.target.value)} />{a.id && atrasada(a) && <div className="small" style={{ color: "var(--red)", marginTop: 6, fontWeight: 600 }}>Atrasada há {-diasAte(a.prazo)} dia(s)</div>}</div>
          </div>
          {!novo && <div className="small muted" style={{ marginTop: 12, lineHeight: 1.6 }}>
            Criada{criador ? " por " + criador.nome : ""}{a.criadoEm ? " em " + new Date(a.criadoEm).toLocaleDateString("pt-BR") : ""}<br />
            {a.concluidoEm && <>Concluída em {new Date(a.concluidoEm).toLocaleDateString("pt-BR")}</>}
          </div>}
        </div>
      </div>
    </Modal>
  );
}

function MembroModal({ ctx, inicial, onClose }) {
  const [m, setM] = useState({ nome: "", cargo: "", setor: "", email: "", telefone: "", foto: "", role: "executor", ...inicial });
  const [erro, setErro] = useState(""); const [busy, setBusy] = useState(false); const arq = useRef();
  const set = (k, v) => setM(p => ({ ...p, [k]: v }));
  const novo = !m.id; const souEu = m.id === ctx.meuId;
  const pixAtual = (m.id && ctx.mapPix[m.id]) || {};
  const [px, setPx] = useState({ tipo: pixAtual.tipo || "cpf", chave: pixAtual.chave || "", titular: pixAtual.titular || "", banco: pixAtual.banco || "" });
  const setP = (k, v) => setPx(p => ({ ...p, [k]: v }));
  const vePix = ctx.gestor || souEu;
  const completo = ctx.role === "admin" || (ctx.role === "gestor" && (novo || m.role === "executor"));
  const setores = [...new Set(ctx.membros.map(x => x.setor).filter(Boolean))];
  async function foto(e) { const f = e.target.files[0]; if (!f) return; try { set("foto", await lerFoto(f)); } catch (er) { setErro("Não foi possível ler a imagem."); } }
  async function salvar() {
    if (!m.nome.trim()) return setErro("Informe o nome.");
    const email = (m.email || "").trim().toLowerCase();
    if (email && ctx.membros.some(x => x.id !== m.id && (x.email || "").toLowerCase() === email)) return setErro("Já existe um perfil com este e-mail.");
    const erroPix = vePix ? validarPix(px.tipo, px.chave.trim()) : "";
    if (erroPix) return setErro(erroPix);
    setBusy(true);
    try {
      const id = m.id || "m_" + uid();
      if (completo) {
        const dados = { nome: m.nome.trim(), cargo: m.cargo.trim(), setor: m.setor.trim(), email, telefone: m.telefone.trim(), foto: m.foto || "", role: m.role };
        await ctx.store.save("membros", id, dados);
        if (m.role !== "admin") {
          if (inicial.email && inicial.email.toLowerCase() !== email) await ctx.store.removerConvite(inicial.email);
          if (email && !m.uid) await ctx.store.convite(email, { role: m.role, membroId: id });
        }
      } else {
        await ctx.store.save("membros", id, { foto: m.foto || "", telefone: m.telefone.trim() });
      }
      if (vePix) {
        const novoPix = { membroId: id, tipo: px.tipo, chave: px.chave.trim(), titular: px.titular.trim(), banco: px.banco.trim() };
        if (novoPix.chave) await ctx.store.save("pix", id, { ...novoPix, atualizadoEm: Date.now() });
        else if (!novoPix.chave && pixAtual.chave) await ctx.store.remove("pix", id);
      }
      ctx.notificar(novo ? "Perfil criado" + (email && !ctx.session.demo ? ". Peça para a pessoa entrar em \"Tenho convite\"." : "") : "Perfil atualizado");
      onClose();
    } catch (e) { setErro(traduzErro(e)); }
    setBusy(false);
  }
  async function excluir() {
    const abertas = ctx.atividades.filter(a => temResp(a, m.id) && a.status !== "concluida");
    if (!confirm(`Excluir o perfil de ${m.nome}?${abertas.length ? ` Ela será retirada de ${abertas.length} atividade(s) em aberto.` : ""}`)) return;
    try {
      for (const a of abertas) { const ids = resps(a).filter(id => id !== m.id); await ctx.store.save("atividades", a.id, { responsavelIds: ids, responsavelId: ids[0] || "", atualizadoEm: Date.now() }); }
      await ctx.store.remove("membros", m.id); if (pixAtual.chave) await ctx.store.remove("pix", m.id).catch(() => {}); if (m.email) await ctx.store.removerConvite(m.email); ctx.notificar("Perfil excluído"); onClose(); ctx.ir("equipe"); } catch (e) { setErro(traduzErro(e)); }
  }
  const podeExcluir = !novo && !souEu && m.role !== "admin" && (ctx.role === "admin" || (ctx.role === "gestor" && m.role === "executor"));
  return (
    <Modal sm titulo={novo ? "Novo perfil" : "Editar perfil"} onClose={onClose}
      rodape={<>{podeExcluir && <button className="btn danger" onClick={excluir}><Icon n="trash" s={15} />Excluir</button>}<div className="grow" /><button className="btn" onClick={onClose}>Cancelar</button><button className="btn pri" disabled={busy} onClick={salvar}>{busy ? "Salvando..." : "Salvar"}</button></>}>
      {erro && <div className="err">{erro}</div>}
      <div className="photo">
        <Avatar m={{ ...m, nome: m.nome || "?" }} size={72} />
        <div><button className="btn sm" onClick={() => arq.current.click()}><Icon n="camera" s={14} />{m.foto ? "Trocar foto" : "Adicionar foto"}</button>
          {m.foto && <button className="linkb" style={{ marginLeft: 10 }} onClick={() => set("foto", "")}>Remover</button>}
          <input ref={arq} type="file" accept="image/*" hidden onChange={foto} /></div>
      </div>
      <div className="fld"><label>Nome completo</label><input value={m.nome} disabled={!completo} onChange={e => set("nome", e.target.value)} /></div>
      <div className="row" style={{ gap: 12, alignItems: "flex-start" }}>
        <div className="fld grow"><label>Cargo</label><input value={m.cargo} disabled={!completo} onChange={e => set("cargo", e.target.value)} /></div>
        <div className="fld grow"><label>Setor</label><input list="setores" value={m.setor} disabled={!completo} onChange={e => set("setor", e.target.value)} /><datalist id="setores">{setores.map(s => <option key={s} value={s} />)}</datalist></div>
      </div>
      <div className="fld"><label>E-mail {!ctx.session.demo && <span className="muted">(usado para a pessoa entrar no app)</span>}</label><input type="email" value={m.email} disabled={!completo || (!!m.uid && !ctx.session.demo)} onChange={e => set("email", e.target.value)} /></div>
      <div className="fld"><label>Telefone / WhatsApp</label><input value={m.telefone} onChange={e => set("telefone", e.target.value)} placeholder="(16) 90000-0000" /></div>
      {vePix && <div className="side-box" style={{ marginBottom: 14 }}>
        <div className="small" style={{ fontWeight: 700, color: "#047857", marginBottom: 10 }}>Chave Pix para pagamento <span className="muted" style={{ fontWeight: 500 }}>(visível só para gestores e para a própria pessoa)</span></div>
        <div className="row" style={{ gap: 12, alignItems: "flex-start" }}>
          <div className="fld" style={{ width: 150, flex: "none" }}><label>Tipo</label><select value={px.tipo} onChange={e => setP("tipo", e.target.value)}>{Object.entries(PIX_TIPOS).map(([k, l]) => <option key={k} value={k}>{l}</option>)}</select></div>
          <div className="fld grow"><label>Chave</label><input value={px.chave} onChange={e => setP("chave", e.target.value)} placeholder={{ cpf: "000.000.000-00", cnpj: "00.000.000/0000-00", email: "nome@email.com", telefone: "(16) 90000-0000", aleatoria: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" }[px.tipo]} /></div>
        </div>
        <div className="row" style={{ gap: 12, alignItems: "flex-start" }}>
          <div className="fld grow" style={{ marginBottom: 0 }}><label>Titular da conta</label><input value={px.titular} onChange={e => setP("titular", e.target.value)} placeholder={m.nome} /></div>
          <div className="fld grow" style={{ marginBottom: 0 }}><label>Banco</label><input value={px.banco} onChange={e => setP("banco", e.target.value)} /></div>
        </div>
      </div>}
      {m.role !== "admin" && completo && <div className="fld"><label>Papel no app</label>
        <select value={m.role} disabled={ctx.role !== "admin"} onChange={e => set("role", e.target.value)}><option value="executor">Executor (vê e atualiza as próprias atividades)</option><option value="gestor">Gestor (cria e distribui atividades)</option></select>
        {ctx.role !== "admin" && <div className="small muted" style={{ marginTop: 4 }}>Somente o administrador cria gestores.</div>}
      </div>}
    </Modal>
  );
}

function ProjetoModal({ ctx, inicial, onClose }) {
  const [p, setP] = useState({ nome: "", descricao: "", cor: CORES[0], prazo: "", ...inicial });
  const [erro, setErro] = useState(""); const set = (k, v) => setP(x => ({ ...x, [k]: v }));
  async function salvar() {
    if (!p.nome.trim()) return setErro("Dê um nome ao projeto.");
    try { const { id, ...d } = p; await ctx.store.save("projetos", id || "p_" + uid(), { ...d, nome: p.nome.trim(), criadoEm: p.criadoEm || Date.now() }); ctx.notificar(id ? "Projeto atualizado" : "Projeto criado"); onClose(); } catch (e) { setErro(traduzErro(e)); }
  }
  return (
    <Modal sm titulo={p.id ? "Editar projeto" : "Novo projeto"} onClose={onClose} rodape={<><button className="btn" onClick={onClose}>Cancelar</button><button className="btn pri" onClick={salvar}>Salvar</button></>}>
      {erro && <div className="err">{erro}</div>}
      <div className="fld"><label>Nome</label><input autoFocus value={p.nome} onChange={e => set("nome", e.target.value)} placeholder="Ex.: Copinha 2027" /></div>
      <div className="fld"><label>Descrição</label><textarea value={p.descricao} onChange={e => set("descricao", e.target.value)} /></div>
      <div className="fld"><label>Entrega prevista (opcional)</label><input type="date" value={p.prazo || ""} onChange={e => set("prazo", e.target.value)} /></div>
      <div className="fld"><label>Cor</label><div className="colors">{CORES.map(c => <button key={c} className={p.cor === c ? "on" : ""} style={{ background: c }} onClick={() => set("cor", c)} />)}</div></div>
    </Modal>
  );
}

function EventoModal({ ctx, inicial, onClose }) {
  const [ev, setEv] = useState({ titulo: "", data: hojeISO(), hora: "", descricao: "", ...inicial });
  const [erro, setErro] = useState(""); const set = (k, v) => setEv(x => ({ ...x, [k]: v })); const g = ctx.gestor;
  async function salvar() {
    if (!ev.titulo.trim() || !ev.data) return setErro("Preencha título e data.");
    try { const { id, ...d } = ev; await ctx.store.save("eventos", id || "e_" + uid(), { ...d, titulo: ev.titulo.trim() }); ctx.notificar("Evento salvo"); onClose(); } catch (e) { setErro(traduzErro(e)); }
  }
  async function excluir() { if (!confirm("Excluir este evento?")) return; try { await ctx.store.remove("eventos", ev.id); ctx.notificar("Evento excluído"); onClose(); } catch (e) { setErro(traduzErro(e)); } }
  return (
    <Modal sm titulo={!ev.id ? "Novo evento" : g ? "Editar evento" : "Evento"} onClose={onClose}
      rodape={g ? <>{ev.id && <button className="btn danger" onClick={excluir}><Icon n="trash" s={15} />Excluir</button>}<div className="grow" /><button className="btn" onClick={onClose}>Cancelar</button><button className="btn pri" onClick={salvar}>Salvar</button></> : <button className="btn" onClick={onClose}>Fechar</button>}>
      {erro && <div className="err">{erro}</div>}
      <div className="fld"><label>Título</label><input autoFocus={!ev.id} value={ev.titulo} disabled={!g} onChange={e => set("titulo", e.target.value)} placeholder="Ex.: Reunião de equipe" /></div>
      <div className="row" style={{ gap: 12 }}>
        <div className="fld grow"><label>Data</label><input type="date" value={ev.data} disabled={!g} onChange={e => set("data", e.target.value)} /></div>
        <div className="fld grow"><label>Horário</label><input type="time" value={ev.hora} disabled={!g} onChange={e => set("hora", e.target.value)} /></div>
      </div>
      <div className="fld"><label>Descrição</label><textarea value={ev.descricao} disabled={!g} onChange={e => set("descricao", e.target.value)} /></div>
    </Modal>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
